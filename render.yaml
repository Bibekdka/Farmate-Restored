services:
  - type: web
    name: farmate-restored
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false # User will provide the Neon URL manually
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FARM_LATITUDE
        value: "26.1445"
      - key: FARM_LONGITUDE
        value: "91.7362"
