<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Farmer App - Kisan Smart{% endblock %}</title>
    
    <!-- External Assets -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar animate-fade">
            <div class="sidebar-header mb-4">
                <a class="sidebar-brand d-flex align-items-center gap-2" href="/">
                    <span class="fs-3">🌾</span>
                    <span>Kisan Smart</span>
                </a>
            </div>
            
            <div class="nav-menu d-flex flex-column mb-auto">
                <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active{% endif %}">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
                <a href="/calendar" class="nav-link {% if request.path == '/calendar' %}active{% endif %}">
                    <i class="fas fa-calendar-alt"></i> Calendar
                </a>
                <a href="/weather_history" class="nav-link {% if request.path == '/weather_history' %}active{% endif %}">
                    <i class="fas fa-cloud-sun"></i> Weather
                </a>
                <a href="/crops" class="nav-link {% if request.path == '/crops' %}active{% endif %}">
                    <i class="fas fa-seedling"></i> Crops & Yield
                </a>
                <a href="/knowledge" class="nav-link {% if request.path == '/knowledge' %}active{% endif %}">
                    <i class="fas fa-brain"></i> Knowledge Hub
                </a>
                <a href="/daily_log" class="nav-link {% if request.path == '/daily_log' %}active{% endif %}">
                    <i class="fas fa-book"></i> Daily Blog
                </a>
                <a href="/notes" class="nav-link {% if request.path == '/notes' %}active{% endif %}">
                    <i class="fas fa-sticky-note"></i> General Notes
                </a>
                <a href="/reminders" class="nav-link {% if request.path == '/reminders' %}active{% endif %}">
                    <i class="fas fa-bell"></i> Tasks
                </a>
                <a href="/reports" class="nav-link {% if request.path == '/reports' %}active{% endif %}">
                    <i class="fas fa-file-invoice-dollar"></i> Reports
                </a>
            </div>

            <!-- Backup Status -->
            <div class="mt-auto">
                <div class="glass-panel p-3 mb-3" style="background: rgba(255,255,255,0.1); border: none;">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <i class="fas fa-shield-alt text-accent"></i>
                        <span class="small fw-bold">Data Protected</span>
                    </div>
                    <div class="small opacity-75" id="sidebar-backup-status">
                        <div id="sidebar-last-backup">Syncing...</div>
                    </div>
                </div>
                <div class="text-center opacity-50 small">
                    v1.2 Standardized
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Mobile Navigation Trigger -->
            <div class="d-md-none mb-4 d-flex align-items-center justify-content-between glass-panel p-3">
                <h4 class="mb-0">🌾 Kisan Smart</h4>
                <button class="btn btn-primary" onclick="document.querySelector('.sidebar').classList.toggle('active')">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <div class="container-fluid">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Standardized Backup Monitoring
        function updateSidebarBackup() {
            fetch('/api/backup_status')
                .then(r => r.json())
                .then(data => {
                    const el = document.getElementById('sidebar-last-backup');
                    if (data.last_backup) {
                        const date = new Date(data.last_backup);
                        el.innerHTML = `<i class="fas fa-check-circle text-success"></i> ${getTimeAgo(date)}`;
                    } else {
                        el.innerHTML = `<i class="fas fa-exclamation-triangle text-warning"></i> No Backups`;
                    }
                })
                .catch(() => {});
        }

        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'Just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            return date.toLocaleDateString();
        }

        updateSidebarBackup();
        setInterval(updateSidebarBackup, 60000);
    </script>
</body>

</html>
